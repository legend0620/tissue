,"flowTitle":"物語が記事になるまで。","flow1Title":"お問い合わせ","flow1Desc":"フォームから、掲載のご希望や質問をお送りください。","flow2Title":"お話を聴く","flow2Desc":"活動のこと、これまでのこと。対話を通じて想いをたどります。","flow3Title":"言葉に紡ぐ","flow3Desc":"伺った内容をもとに、あなたらしい文章を形にします。","flow4Title":"一緒に整える","flow4Desc":"内容をご確認いただき、表現やニュアンスを調整します。","flow5Title":"掲載・お届け","flow5Desc":"完成した記事をnoteで公開します。","aboutEyebrow":"THE PERSON BEHIND THE STORIES","aboutTitle":"書く人ではなく、\n人生のとなりで聴く人。","aboutName":"木全 彩花（きまた あやか）","aboutRole":"「たしかなこと」運営・取材ライター","aboutBody":"大学で学生たちのキャリア支援に携わり、一人ひとりの経験を聴きながら言葉にすることの力を実感。のちに取材ライターへ転身し、さまざまな生き方を記事にしてきました。誰もが自分の歩みにある「たしかなもの」を見つけられるように。そんな想いから、このメディアを続けています。","aboutProof":"取材・執筆記事 150本以上","aboutProofNote":"※本人の2026年1月公開記事に記載された実績。","aboutButton":"木全彩花のストーリーを読む","faqEyebrow":"FAQ","faqTitle":"よくあるご質問","faq1Q":"話すのが苦手でも、取材をお願いできますか？","faq1A":"はい。記事では、話がまとまっていない方も歓迎していると案内されています。対話を通して、一緒に言葉を探していきます。","faq2Q":"特別な実績がなくても掲載できますか？","faq2A":"「たしかなこと」は肩書きや成功だけではなく、日々の選択や想いを大切にするメディアです。まずはご自身のことをお聞かせください。","faq3Q":"制作した記事は自分のSNSやWebサイトで紹介できますか？","faq3A":"公開済みの掲載案内では、記事へのリンク掲載や文章の一部活用が紹介されています。最新の利用条件は事前にご確認ください。","faq4Q":"料金や納期はどのくらいですか？","faq4A":"料金や制作スケジュールは、現在の条件を直接お問い合わせください。過去の案内から変更されている場合があります。","faq5Q":"掲載するか迷っています。質問だけでも大丈夫ですか？","faq5A":"はい。運営者の案内では、掲載の有無にかかわらず質問や相談を受け付けています。お気軽にお問い合わせください。","contactEyebrow":"THE NEXT CHAPTER","contactTitle":"あなたの物語も、\n誰かの光になる。","contactLead":"まずは、ひとつの物語から。\n読みたい人も、語りたい人も。ここから新しい一節を。","contactButton":"物語の掲載を相談する","contactReadButton":"noteで物語を読む","footerNote":"このページは公開記事をもとに制作したLPデモです。公式サイトとしての公開には運営者の確認が必要です。","noteUrl":"https://note.com/tashikana_koto","contactUrl":"https://forms.gle/kCVWWd7fmpvnfnYp7","aboutUrl":"https://note.com/ayaka0406/n/n16eeb799a013","lineUrl":"https://lin.ee/YCco1b0"},"sections":[{"id":"hero","visible":true},{"id":"welcome","visible":true},{"id":"concept","visible":true},{"id":"stories","visible":true},{"id":"promise","visible":true},{"id":"voice","visible":true},{"id":"service","visible":true},{"id":"flow","visible":true},{"id":"about","visible":tr case 'promise':return `<section id="promise" class="section promise"><div class="container">${title(c.promiseEyebrow,c.promiseTitle)}<div class="promise-grid">${[1,2,3].map(i=>`<article class="promise-card"><span class="promise-num">0${i}.</span><h3>${esc(c['promise'+i+'Title'])}</h3><p>${esc(c['promise'+i+'Desc'])}</p></article>`).join('')}</div></div></section>`;
case 'voice':return `<section id="voice" class="section voice"><div class="container">${title(c.voiceEyebrow,c.voiceTitle)}<div class="voice-wrap">${[1,2].map(i=>`<div class="voice-card"><blockquote>${esc(c['voice'+i])}</blockquote><cite>— ${esc(c['voice'+i+'From'])}</cite></div>`).join('')}</div><p class="voice-note">${esc(c.voiceNote)}</p></div></section>`;
case 'service':return `<section id="service" class="section service"><div class="container service-layout"><div class="service-left"><span class="eyebrow">${esc(c.serviceEyebrow)}</span><h2 class="heading">${nl(c.serviceTitle)}</h2><p class="body-copy">${esc(c.serviceLead)}</p></div><div class="service-card"><span class="mini-label">INTERVIEW & WRITING</span><h3>${esc(c.serviceOfferTitle)}</h3><p>${esc(c.serviceOfferDesc)}</p><div class="service-detail"><strong>こんな方に</strong>${esc(c.serviceWho)}</div><div class="price-line">${esc(c.servicePrice)}</div><div class="tiny-note">${esc(c.servicePriceNote)}</div>${btn(c.contactUrl,c.serviceButton)}</div></div></section>`;
case 'flow':return `<section id="flow" class="section flow"><div class="container">${title(c.flowEyebrow,c.flowTitle)}<div class="flow-grid">${[1,2,3,4,5].map(i=>`<div class="flow-step"><div class="flow-num">0${i}</div><h3>${esc(c['flow'+i+'Title'])}</h3><p>${esc(c['flow'+i+'Desc'])}</p></div>`).join('')}</div></div></section>`;
case 'about':return `<section id="about" class="section about"><div class="container about-layout"><div class="about-visual">${cfg.images.about?`<img src="${esc(cfg.images.about)}" alt="運営者紹介画像" loading="lazy">`:`<div class="about-art"><svg viewBox="0 0 250 350" aria-hidden="true"><path d="M120 318c-13-82-20-121-40-168C59 110 45 94 51 63 77 80 98 99 108 132c-21-71-11-102 7-120 18 42 29 80 16 134 17-36 40-63 71-72-1 40-22 65-62 93 47-27 78-21 97-2-21 30-54 41-99 35 38 18 49 40 55 66-31 10-56-1-74-27 7 32 7 55 4 78"/><path d="M32 320c40-22 92-18 158-2M20 337c59-14 105-11 202-4"/></svg><span>every story matters</span></div>`}</div><div><span class="eyebrow">${esc(c.aboutEyebrow)}</span><h2 class="heading">${nl(c.aboutTitle)}</h2><h3 class="about-name">${esc(c.aboutName)}</h3><div class="about-role">${esc(c.aboutRole)}</div><p class="body-copy">${esc(c.aboutBody)}</p><div class="about-proof"><strong>${esc(c.aboutProof)}</strong><small>${esc(c.aboutProofNote)}</small></div>${href(c.aboutUrl,'text-link',c.aboutButton)}</div></div></section>`;
case 'faq':return `<section id="faq" class="section faq"><div class="container">${title(c.faqEyebrow,c.faqTitle)}<div class="faq-list">${[1,2,3,4,5].map(i=>`<details class="faq-item"><summary><span><span class="q-symbol">Q.</span>${esc(c['faq'+i+'Q'])}</span></summary><div class="answer">${esc(c['faq'+i+'A'])}</div></details>`).join('')}</div></div></section>`;
case 'contact':return `<section id="contact" class="contact"><div class="container contact-inner"><span class="eyebrow">${esc(c.contactEyebrow)}</span><h2 class="heading">${nl(c.contactTitle)}</h2><p class="body-copy">${nl(c.contactLead)}</p><div class="contact-actions">${btn(c.contactUrl,c.contactButton)}${btn(noteUrl(),c.contactReadButton,'btn ghost')}</div></div></section>`;
default: if(cfg.custom[id]){const co=cfg.custom[id];return `<section class="section custom-section" id="${esc(id)}"><div class="container custom-box"><span class="eyebrow">${esc(co.eyebrow)}</span><h2 class="heading">${nl(co.title)}</h2><p class="body-copy">${nl(co.body)}</p></div></section>`}return '';
}}
function applyTheme(){let t=cfg.theme;const root=document.documentElement;[['--primary',t.primary],['--accent',t.accent],['--paper',t.paper],['--ink',t.ink]].forEach(([k,v])=>{if(/^#[\da-f]{6}$/i.test(v))root.style.setProperty(k,v)});root.style.setProperty('--radius',Math.max(0,Math.min(38,Number(t.radius)||0))+'px');root.style.setProperty('--space',Math.max(.7,Math.min(1.4,Number(t.spacing)||1)));if(t.font==='sans')root.style.setProperty('--serif','var(--sans)');else root.style.removeProperty('--serif');if(t.button==='square')root.style.setProperty('--radius','6px');}
function render(){applyTheme();const c=C();let nav=[['concept','このメディアについて'],['stories','物語を読む'],['service','掲載のご案内'],['about','運営者'],['faq','FAQ']].filter(([id])=>isVisible(id));document.getElementById('siteHeader').innerHTML=`<div class="header-inner"><a class="brand-logo" href="#hero"><span class="brand-main">${esc(c.brand)}</span><span class="brand-caption">${esc(c.brandSub)}</span></a><nav class="nav-links" aria-label="メインナビゲーション">${nav.map(([id,name])=>`<a href="#${id}">${name}</a>`).join('')}${href(c.contactUrl,'btn small',c.navCta)}</nav></div>`;
document.getElementById('siteMain').innerHTML=cfg.sections.filter(s=>s.visible).map(s=>renderSection(s.id)).join('');document.getElementById('siteFooter').innerHTML=`<div class="footer"><div class="footer-inner"><div class="footer-main"><div><div class="footer-logo">${esc(c.brand)}</div><div class="footer-tag">${esc(c.brandSub)}</div></div><nav class="footer-nav" aria-label="関連リンク">${href(noteUrl(),'','noteで読む')}${href(c.aboutUrl,'','運営者の記事')}${href(c.lineUrl,'','公式LINE')}${href(c.contactUrl,'','掲載のご相談')}</nav></div><div class="footer-bottom"><p>${esc(c.footerNote)}</p><span>© ${new Date().getFullYear()} ${esc(c.brand)} — LP DEMO</span></div></div></div>`;document.title=c.brand+' | '+c.brandSub;let meta=document.querySelector('meta[name="description"]');if(meta)meta.content=c.heroLead.replace(/\n/g,' ').slice(0,130);}
const scrollTop=document.getElementById('scrollTop');scrollTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));window.addEventListener('scroll',()=>scrollTop.classList.toggle('show',window.scrollY>600),{passive:true});
const E=id=>document.getElementById(id),editTabs=['文章','デザイン','画像','セクション','保存'];let tab=0,active='hero';
function toast(s){const n=document.createElement('div');n.className='toast';n.textContent=s;document.body.appendChild(n);setTimeout(()=>n.remove(),3300)}
function save(silent=true){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(cfg));if(!silent)toast('この端末のブラウザに保存しました')}catch(err){if(!silent)toast('保存できませんでした。JSON書き出しをご利用ください')}}
function updateSite(){render();save();}
function editField(label,key,type){let val=cfg.content[key]??'';if(type==='long')return `<label class="edit-field">${esc(label)}<textarea rows="3" data-field="${esc(key)}">${esc(val)}</textarea></label>`;return `<label class="edit-field">${esc(label)}<input type="${type==='url'?'url':'text'}" data-field="${esc(key)}" value="${esc(val)}"></label>`}
function getEditorHtml(){if(tab===0){let f=fielddefs[active]||[];if(cfg.custom[active]){return `<div class="edit-help">独自セクションの文章を編集できます。</div>${[['小見出し','eyebrow'],['見出し','title'],['本文','body','long']].map(([label,key,type])=>`<label class="edit-field">${label}${type==='long'?`<textarea data-custom="${key}">${esc(cfg.custom[active][key])}</textarea>`:`<input data-custom="${key}" value="${esc(cfg.custom[active][key])}">`}</label>`).join('')}`};return `<div class="edit-help">文字を入力するとLPにすぐ反映されます。編集中の位置はセクション名から選べます。</div><label class="edit-field">編集するセクション<select id="editSectionSelect">${cfg.sections.map(s=>`<option value="${esc(s.id)}" ${s.id===active?'selected':''}>${esc(names[s.id]||cfg.custom[s.id]?.title||s.id)}</option>`).join('')}</select></label><h3 class="edit-heading">✎ テキストを編集</h3>${f.map(([l,k,t])=>editField(l,k,t)).join('')}`;}
if(tab===1){let t=cfg.theme;return `<div class="edit-help">カラーパレットやフォントを切り替えると、全セクションへ即時反映されます。</div><h3 class="edit-heading">配色</h3>${[['メインカラー','primary'],['アクセントカラー','accent'],['ページの背景','paper'],['文字色','ink']].map(([l,k])=>`<label class="edit-field">${l}<input class="edit-color" type="color" data-theme="${k}" value="${esc(t[k])}"></label>`).join('')}<h3 class="edit-heading">かたちと余白</h3><label class="edit-field">フォント<select data-theme="font"><option value="serif" ${t.font==='serif'?'selected':''}>明朝体（エディトリアル）</option><option value="sans" ${t.font==='sans'?'selected':''}>ゴシック体（モダン）</option></select></label><label class="edit-field">ボタン形状<select data-theme="button"><option value="pill" ${t.button==='pill'?'selected':''}>やわらかい角丸</option><option value="square" ${t.button==='square'?'selected':''}>シャープ</option></select></label><label class="edit-field">角丸 ${Number(t.radius)} px<input type="range" min="0" max="38" step="1" data-theme="radius" value="${Number(t.radius)}"></label><label class="edit-field">セクション間の余白 ${Number(t.spacing).toFixed(1)} 倍<input type="range" min="0.7" max="1.4" step="0.1" data-theme="spacing" value="${Number(t.spacing)}"></label>`;}
if(tab===2){return `<div class="edit-help">画像を選ぶとLPへ即時反映します。画像URLの指定も可能です。実在する人物の写真は、本人の許可を得て使用してください。</div>${[['hero','メインビジュアル'],['concept','コンセプト画像'],['about','運営者画像'],['story1','記事 1 の画像'],['story2','記事 2 の画像'],['story3','記事 3 の画像']].map(([id,l])=>`<div><h3 class="edit-heading">▧ ${l}</h3><label class="edit-field">画像URL<input data-image-url="${id}" value="${esc((cfg.images[id]||'').startsWith('data:')?'':cfg.images[id])}" placeholder="https://..."></label><label class="edit-field">画像ファイル<input type="file" accept="image/*" data-image-file="${id}"></label><div class="edit-group"><button class="edit-panel-btn" type="button" data-image-clear="${id}">画像をリセット</button></div></div><hr class="edit-divider">`).join('')}`;}
if(tab===3){return `<div class="edit-help">表示・非表示、上下への移動に対応します。独自セクションも追加できます。ヘッダーは現在表示中のセクションと連動します。</div><h3 class="edit-heading">セクションの順番</h3>${cfg.sections.map((s,i)=>`<div class="section-row"><span class="section-name ${s.visible?'':'hidden-section'}">${esc(names[s.id]||cfg.custom[s.id]?.title||s.id)}</span><div style="display:flex;gap:4px;align-items:center"><button title="上に移動" data-move="${i}:-1" ${i===0?'disabled':''}>↑</button><button title="下に移動" data-move="${i}:1" ${i===cfg.sections.length-1?'disabled':''}>↓</button><label style="display:flex;align-items:center;gap:2px"><input aria-label="表示切替" type="checkbox" data-visible="${esc(s.id)}" ${s.visible?'checked':''}></label>${cfg.custom[s.id]?`<button title="削除" data-delete="${esc(s.id)}">✕</button>`:''}</div></div>`).join('')}<hr class="edit-divider"><h3 class="edit-heading">自由セクションを追加</h3><div class="edit-group"><button class="edit-panel-btn primary wide" id="addCustom">＋ テキストセクションを追加</button></div>`;}
return `<div class="edit-help">編集内容はこのブラウザ内に保存できます。公開用HTMLをダウンロードすれば、編集した内容をそのまま表示できます。</div><h3 class="edit-heading">編集データ</h3><button class="edit-panel-btn primary wide" id="saveSettings">✓ ブラウザに設定を保存</button><div class="edit-group"><button class="edit-panel-btn" id="exportJson">↓ JSONを書き出し</button><button class="edit-panel-btn" id="importJson">↑ JSONを読み込み</button><input type="file" id="jsonInput" accept=".json,application/json" hidden></div><hr class="edit-divider"><h3 class="edit-heading">公開ページの作成</h3><button class="edit-panel-btn primary wide" id="exportHTML">↓ 公開用HTMLを書き出し</button><p class="compact-info">公開用HTMLは現在の設定を組み込みます。アップロードして公開するには、ご自身のサーバー／ホスティングへの配置が必要です。</p><hr class="edit-divider"><h3 class="edit-heading">リセット</h3><button class="edit-panel-btn" id="resetSettings">初期状態に戻す</button><p class="compact-info">※ローカル保存は端末間で同期されません。編集URLはパスワード保護ではありません。正式な管理画面の公開には認証が必要です。</p>`;
}
function renderPanel(){if(!isEditor)return;E('editTabs').innerHTML=editTabs.map((v,i)=>`<button type="button" data-tab="${i}" class="${tab===i?'active':''}">${v}</button>`).join('');E('editBody').innerHTML=getEditorHtml();}
function download(name,contents,type){let url=URL.createObjectURL(new Blob([contents],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function exportPublic(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#default-json').textContent=JSON.stringify(cfg).replace(/</g,'\\u003c');let js=clone.querySelector('#runtime-script');js.textContent=js.textContent.replace('const EDITOR_DEFAULT=true;','const EDITOR_DEFAULT=false;');clone.querySelector('body').classList.remove('editor-mode','mobile-preview');download('tashikana_koto_published.html','<!doctype html>\n'+clone.outerHTML,'text/html;charset=utf-8');toast('公開用HTMLを書き出しました')}
if(isEditor){renderPanel();E('editTabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(!b)return;tab=+b.dataset.tab;renderPanel()});E('editBody').addEventListener('input',e=>{let n=e.target;if(n.dataset.field){cfg.content[n.dataset.field]=n.value;updateSite()}else if(n.dataset.theme){cfg.theme[n.dataset.theme]=n.value;updateSite()}else if(n.dataset.custom){cfg.custom[active][n.dataset.custom]=n.value;updateSite()}});E('editBody').addEventListener('change',async e=>{let n=e.target;if(n.id==='editSectionSelect'){active=n.value;renderPanel()}else if(n.dataset.visible){let sec=cfg.sections.find(s=>s.id===n.dataset.visible);if(sec)sec.visible=n.checked;updateSite();renderPanel()}else if(n.dataset.imageUrl){let url=n.value.trim();if(url&&!validURL(url)){toast('http(s)形式の画像URLを入力してください');return;}cfg.images[n.dataset.imageUrl]=url;updateSite()}else if(n.dataset.imageFile){let file=n.files?.[0];if(!file)return;if(file.size>10*1024*1024){toast('画像は10MB以下を選択してください');return}if(!file.type.startsWith('image/')){toast('画像ファイルを選択してください');return}let data=await new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});cfg.images[n.dataset.imageFile]=data;updateSite();toast('画像を差し替えました')}});
E('editBody').addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.move){let[i,d]=b.dataset.move.split(':').map(Number);let j=i+d;if(j<0||j>=cfg.sections.length)return;[cfg.sections[i],cfg.sections[j]]=[cfg.sections[j],cfg.sections[i]];updateSite();renderPanel()}else if(b.dataset.delete){let id=b.dataset.delete;if(!confirm('このセクションを削除しますか？'))return;cfg.sections=cfg.sections.filter(s=>s.id!==id);delete cfg.custom[id];active='hero';updateSite();renderPanel()}else if(b.dataset.imageClear){cfg.images[b.dataset.imageClear]='';updateSite();renderPanel();toast('画像をリセットしました')}else if(b.id==='addCustom'){let id='custom'+Date.now();cfg.custom[id]={eyebrow:'YOUR SECTION',title:'新しいセクション',body:'ここに本文を入力してください。'};cfg.sections.splice(cfg.sections.length-1,0,{id,visible:true});active=id;tab=0;updateSite();renderPanel();toast('新しいセクションを追加しました')}else if(b.id==='saveSettings'){save(false)}else if(b.id==='exportJson'){download('tashikana_koto_settings.json',JSON.stringify(cfg,null,2),'application/json;charset=utf-8')}else if(b.id==='importJson'){E('jsonInput').click()}else if(b.id==='exportHTML'){exportPublic()}else if(b.id==='resetSettings'){if(!confirm('編集内容を初期化しますか？'))return;localStorage.removeItem(STORAGE_KEY);cfg=JSON.parse(jsonNode.textContent);active='hero';tab=0;updateSite();renderPanel();toast('初期化しました')}});
E('editBody').addEventListener('change',async e=>{if(e.target.id!=='jsonInput')return;try{let raw=await e.target.files[0].text(),parsed=JSON.parse(raw);if(!parsed.content||!parsed.theme||!Array.isArray(parsed.sections)||!parsed.images)throw Error('invalid');cfg=parsed;active=cfg.sections[0]?.id||'hero';updateSite();renderPanel();toast('設定を読み込みました')}catch{toast('設定ファイルを読み込めませんでした')}});
E('previewBar').addEventListener('click',e=>{let b=e.target.closest('[data-preview]');if(!b)return;let isMobile=b.dataset.preview==='mobile';document.body.classList.toggle('mobile-preview',isMobile);E('previewBar').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));});}
render();
})();
</script>
</body></html>
